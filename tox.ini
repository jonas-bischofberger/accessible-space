[tox]
minversion = 4.0.0
isolated_build = True
requires = tox-uv
envlist =
    py37,
    py39,
    py312,
    py313,

    py39-np1.20-pd1.5-mpl3.7,
    py312-np2.2-pd2.2-mpl3.10,
    py313-pd3,

;    py37-np1.14.6-pd1.0-scipy1.4-mpl3.3,  ; not working

; Usage
;   tox                        -> all envs, minimal deps, slow tests skipped, no coverage
;   tox p -p 3                 -> same, 3 envs in parallel
;   tox -e py312-full          -> full dev deps (dashboards, databallpy, ...), all tests incl. slow, with coverage


[testenv]
description = Run pytest for each specified Python environment
extras =
    !full: test
    full-!py37: dev
    full-py37: dev37
deps =
    full: pytest-cov
    mpl3.10: matplotlib==3.10.*
    mpl3.7: matplotlib==3.7.*
    mpl3.3: matplotlib==3.3.*
    pd3: pandas==3.*
    pd2.2: pandas==2.2.*
    pd1.5: pandas==1.5.*
    pd1.0: pandas==1.0.*
    np2.2: numpy==2.2.*
    np1.20: numpy==1.20.*
    np1.20: numexpr==2.8.*
    np1.14.6: numpy==1.14.6
commands =
    python -c "import sys, numpy, pandas, matplotlib; print(sys.version.split()[0], 'numpy', numpy.__version__, 'pandas', pandas.__version__, 'mpl', matplotlib.__version__)"
    !full: python -m pytest -m "not slow" {posargs}
    full: python -m pytest --cov=accessible_space {posargs}
