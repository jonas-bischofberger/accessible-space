[project]
name = "accessible_space"
version = "2.1.0"
authors = [
  {name="Jonas Bischofberger", email="jonas.bischofberger@univie.ac.at"},
]
description = "Implementation of the Dangerous Accessible Space (DAS) passing model for football analytics."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"
dependencies = [
    "matplotlib",
    "numpy",
    "numexpr",
    "pandas",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[project.optional-dependencies]
full = [
    "scikit-learn",
    "kloppy>=3.15.0",
    "xmltodict",
    "streamlit",
    "wfork-streamlit-profiler",
    "brokenaxes",
    "mplsoccer",
    "databallpy; python_version >= '3.10'",
    "numpy<2.3.0",  # necessary for databallpy
]
dev = [
    "scikit-learn",
    "kloppy>=3.15.0",
    "xmltodict",
    "streamlit",
    "wfork-streamlit-profiler",
    "brokenaxes",
    "mplsoccer",
    "databallpy; python_version >= '3.10'",
    "numpy<2.3.0",  # necessary for databallpy
    "pytest",
    "pytest-cov",
    "build",
    "twine",
    "setuptools",
    "tox",
    "requests",
    "packaging",
]
dev37 = [
    "scikit-learn",
    "kloppy>=3.15.0",
    "xmltodict",
    "streamlit",
    "wfork-streamlit-profiler",
    "brokenaxes",
    "mplsoccer",
    "pytest",
    "pytest-cov",
    "build",
    "twine",
    "setuptools",
    "tox",
    "requests",
    "packaging",
]
test = [  # minimal dependencies to run a light test suite
    "pytest",
    "packaging",
    "requests",
    "xmltodict",
]


[project.urls]
Repository = "https://github.com/jonas-bischofberger/accessible-space"
Changelog = "https://github.com/jonas-bischofberger/accessible-space/blob/main/CHANGELOG.md"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--doctest-modules --doctest-continue-on-failure -rsx"
filterwarnings = """
    ignore:Inferring attacking direction:UserWarning
    ignore:Range of tracking Y coordinates:UserWarning
    ignore:Range of tracking X coordinates:UserWarning
"""
norecursedirs = [
    ".joblib-cache",
    "apps",
]
